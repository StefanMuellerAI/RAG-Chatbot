services:
  sql:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      SQL_EXECUTOR_TOKEN: ${SQL_EXECUTOR_TOKEN:?set SQL_EXECUTOR_TOKEN}
      BLOB_READ_WRITE_TOKEN: ${BLOB_READ_WRITE_TOKEN:?set BLOB_READ_WRITE_TOKEN}
    mem_limit: 1g
    cpus: 2
    pids_limit: 64
    read_only: true
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 3s
      retries: 3
